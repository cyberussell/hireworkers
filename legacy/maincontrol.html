<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main Control · Job.Work.Pay</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preload" href="styles.css?v=2" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="styles.css?v=2"></noscript>
    <link rel="stylesheet" href="maincontrol.css?v=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='14' font-size='14'%3EJW%3C/text%3E%3C/svg%3E">
  </head>
  <body class="admin-body">
    <div id="loginScreen" class="admin-login">
      <form id="loginForm" class="admin-login-card">
        <h1>Main Control</h1>
        <p class="admin-login-hint">Enter the admin password to continue.</p>
        <input type="password" id="passwordInput" name="password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit">Unlock</button>
        <p class="admin-error" id="loginError" role="alert"></p>
      </form>
    </div>

    <div id="dashboard" class="admin-dashboard hidden">
      <header class="admin-header">
        <h1>Main Control</h1>
        <button id="logoutButton" class="admin-logout" type="button">Log out</button>
      </header>

      <section class="admin-stats" id="statsSection"></section>

      <nav class="admin-tabs" id="tabs">
        <button class="admin-tab is-active" type="button" data-tab="jobs">Job Posts</button>
        <button class="admin-tab" type="button" data-tab="intake">Intake Sessions</button>
        <button class="admin-tab" type="button" data-tab="seekers">Seeker Profiles</button>
      </nav>

      <section class="admin-panel" id="jobsPanel">
        <div class="admin-panel-toolbar">
          <select id="jobStatusFilter">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="published">Published</option>
            <option value="rejected">Rejected</option>
          </select>
          <button id="refreshJobs" type="button">Refresh</button>
        </div>
        <div class="admin-table-wrap" id="jobsTable"></div>
      </section>

      <section class="admin-panel hidden" id="intakePanel">
        <div class="admin-panel-toolbar">
          <button id="refreshIntake" type="button">Refresh</button>
        </div>
        <div class="admin-table-wrap" id="intakeTable"></div>
      </section>

      <section class="admin-panel hidden" id="seekersPanel">
        <div class="admin-panel-toolbar">
          <button id="refreshSeekers" type="button">Refresh</button>
        </div>
        <div class="admin-table-wrap" id="seekersTable"></div>
      </section>
    </div>

    <script src="maincontrol.js?v=1" defer></script>
  </body>
</html>
